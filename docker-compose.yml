services:
  app:
    build: .
    ports:
      - "8000:8000"
    # API Key 等敏感配置从本地 .env 注入，不打进镜像
    env_file:
      - .env
    # 持久化向量库（含 chunks.json）和上传目录，容器重建数据不丢
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
